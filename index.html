    <meta name="robots" content="index, follow" />

    <!-- OpenGraph / sosyal paylaşım önizlemesi -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Çobantaş Gayrimenkul İnşaat" />

    <meta property="og:image" content="https://cobantas.com/pinnacle.jpg" />
    <meta property="og:locale" content="tr_TR" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Çobantaş | Gayrimenkul & İnşaat" />
    <meta name="twitter:description" content="2005'ten bu yana fabrika, konut ve taahhüt projelerinde köklü tecrübe." />
    <meta name="twitter:image" content="https://cobantas.com/pinnacle.jpg" />

    <!-- Yapısal veri: Google zengin sonuç / yerel işletme -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "GeneralContractor",
        "name": "Çobantaş Gayrimenkul İnşaat",
        "url": "https://cobantas.com",
        "logo": "https://cobantas.com/cobantas-logo.jpeg",
        "image": "https://cobantas.com/pinnacle.jpg",
        "telephone": "+90-532-524-41-93",
        "email": "info@cobantas.com",
        "foundingDate": "2005",
        "founder": { "@type": "Person", "name": "Mustafa Çoban" },
        "address": {
          "@type": "PostalAddress",
          "streetAddress": "Atatürk Mah. Komsan Üstü Yolu Cad. Residance Quality No:4/211",
          "addressLocality": "Küçükçekmece",
          "addressRegion": "İstanbul",
          "addressCountry": "TR"
        },
        "areaServed": "İstanbul",
        "sameAs": ["https://instagram.com/cobantas_fksy"]
      }
    </script>

    <!-- Premium tipografi: zarif serif başlıklar + temiz sans gövde -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,500&family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <!--
      Giriş perdesi: ilk boyamada anında siyah olsun diye stiller satır içi.
      (CSS paketi yüklenmeden önce de çalışır; beyaz sıçrama olmaz.)
    -->
    <style>
      #intro {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: grid;
        place-items: center;
        background: #000;
        transition: transform 620ms cubic-bezier(0.76, 0, 0.24, 1);
        will-change: transform;
      }
      #intro img {
        width: 130px;
        max-width: 40vw;
        height: auto;
        /* Logo siyah-üzerine-beyaz JPEG; ters çevirince beyaz mark siyah zeminde kusursuz oturur */
        filter: invert(1);
        animation: introLogo 420ms ease-out both;
      }
      @keyframes introLogo {
        from { opacity: 0; transform: scale(0.92); }
        to { opacity: 1; transform: none; }
      }
      /* Soldan sağa kayarak çık */
      #intro.intro-leave { transform: translateX(100%); }

      @media (prefers-reduced-motion: reduce) {
        #intro { display: none; }
      }
    </style>
  </head>
  <body>
    <!-- Giriş perdesi (yalnızca anasayfa). Çıkışını React, uygulama hazır olunca tetikler. -->
    <div id="intro" aria-hidden="true">
      <img src="/cobantas-logo.jpeg" alt="" />
    </div>
    <script>
      (function () {
        var el = document.getElementById('intro');
        if (!el) return;
        var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
        // Sadece anasayfada göster; hareketi azalt tercihinde hiç gösterme
        if (window.location.pathname !== '/' || reduce) {
          el.remove();
          return;
        }
        // Güvenlik ağı: uygulama bir sebeple açılmazsa perde ekranda kilitli kalmasın
        window.__introFailsafe = setTimeout(function () {
          if (el.parentNode) el.remove();
        }, 4000);
      })();
    </script>

    <!--
      Netlify Forms tespiti: Netlify bu gizli statik formu derleme anında tarayıp
      "iletisim" formunu ve alanlarını kaydeder. React formu bu ada AJAX ile gönderir.
    -->
    <form name="iletisim" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="hidden" name="form-name" value="iletisim" />
      <input name="bot-field" />
      <input type="text" name="ad" />
      <input type="text" name="soyad" />
      <input type="email" name="email" />
      <input type="tel" name="telefon" />
      <textarea name="aciklama"></textarea>
    </form>

    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
